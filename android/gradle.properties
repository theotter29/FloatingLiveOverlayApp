# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Hermes JS engine
hermesEnabled=true

# Kotlin & Java configuration

# Disable problematic gradle features for Termux
org.gradle.configuration-cache=false
org.gradle.unsafe.isolated-projects=false
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dkotlin.version=1.9.0

# Kotlin compiler configuration
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dkotlin.compiler.incremental=true
kotlin.stdlib.default.platform.dependencies=false
